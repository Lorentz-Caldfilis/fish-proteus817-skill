name: Offline correctness

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8"
      - name: Lint offline sources
        run: python -m ruff check .

  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and public-validation dependencies
        run: python -m pip install ".[dsh]"
      - name: Unit and negative tests without Proteus or private course files
        run: python -B -m unittest discover -s tests -v
      - name: Read-only CLI import
        run: python -B -m fish_proteus --version
      - name: Build and audit public source tree without private inputs
        run: python -B tools/public_release.py --output .work/ci-public-source
      - name: Retain the reviewed public source candidate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: public-source-candidate
          path: |
            .work/ci-public-source/*-source.zip
            .work/ci-public-source/SHA256SUMS
          if-no-files-found: error

  skill-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the pinned official Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate the skill against the reference implementation
        run: skills-ref validate skills/fish-proteus817
