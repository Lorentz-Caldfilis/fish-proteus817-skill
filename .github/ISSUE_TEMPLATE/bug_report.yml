name: Bug report / 问题报告
description: Report a reproducible failure without private course files or credentials.
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment / 版本与环境
      description: Include project, Python, Windows, Proteus and DSH versions as relevant. Remove user names and full private paths.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failing stage / 失败阶段
      options:
        - Installation or skill discovery
        - Import or prepare
        - Build
        - Proteus runtime or capture
        - Verification
        - Public source export
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, expected result and actual result / 复现、预期与实测
      description: Provide sanitized commands and error text. Do not upload teacher projects, diagrams, screenshots, native graphs, session logs or credentials.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-content check / 公开内容检查
      options:
        - label: I removed credentials, personal paths and course materials from this report.
          required: true
